id: picnic-good-001
category: leisure
severity: info
applies_to:
  - picnic
conditions:
  all:
    - source: hourly
      field: precipitation_probability
      agg: max
      op: "<"
      value: 30
    - source: hourly
      field: temperature_2m
      agg: min
      op: ">="
      value: 18
    - source: hourly
      field: temperature_2m
      agg: max
      op: "<="
      value: 32
    - source: hourly
      field: wind_gusts_10m
      agg: max
      op: "<"
      value: 25
rubric: These are soft comfort bands, not safety thresholds.
guidance: Conditions look comfortable for a picnic.
